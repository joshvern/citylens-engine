name: recovery-verification

on:
  schedule:
    # Daily, offset from other CityLens and shared-runner schedules.
    - cron: "31 7 * * *"
  workflow_dispatch:
    inputs:
      manage_incident:
        description: Reconcile the production incident from this manual run
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: recovery-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recovery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_RECOVERY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_RECOVERY_VERIFIER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Verify production recovery
        env:
          PROJECT_ID: ${{ vars.CITYLENS_GCP_PROJECT }}
          ARTIFACT_BUCKET: ${{ vars.CITYLENS_ARTIFACT_BUCKET }}
          REGION: ${{ vars.CITYLENS_GCP_REGION }}
        run: |
          python scripts/verify_production_recovery.py \
            --project "${PROJECT_ID}" \
            --bucket "${ARTIFACT_BUCKET}" \
            --location "${REGION}" \
            --allow-collecting \
            > production-recovery-verification.json

      - name: Publish recovery summary
        if: always()
        run: |
          if [[ ! -s production-recovery-verification.json ]]; then
            echo "## ❌ CityLens production recovery" >> "${GITHUB_STEP_SUMMARY}"
            echo "The verifier exited before it could write a report." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json

          report = json.load(
              open("production-recovery-verification.json", encoding="utf-8")
          )
          status = report.get("status", "unknown")
          icon = {"ready": "✅", "collecting": "🟡"}.get(status, "❌")
          print(f"## {icon} CityLens production recovery")
          print()
          print(f"- Status: `{status}`")
          print(f"- Verified at: `{report.get('verified_at', 'unknown')}`")
          print(
              f"- Configuration healthy: "
              f"`{str(report.get('configuration_healthy', False)).lower()}`"
          )
          print(f"- READY backups: `{report.get('ready_backup_count', 0)}`")
          latest = report.get("latest_ready_backup") or {}
          print(
              f"- Latest snapshot: `{latest.get('snapshot_time', 'pending')}`"
          )
          print(
              f"- Latest expiry: `{latest.get('expire_time', 'pending')}`"
          )
          warnings = report.get("warnings") or []
          if warnings:
              print()
              print("### Warnings")
              for warning in warnings:
                  print(f"- {warning}")
          failures = report.get("failures") or []
          if failures:
              print()
              print("### Failures")
              for failure in failures:
                  print(f"- {failure}")
          PY

      - name: Flag initial backup collection
        if: success()
        run: |
          python - <<'PY'
          import json

          report = json.load(
              open("production-recovery-verification.json", encoding="utf-8")
          )
          if report.get("status") == "collecting":
              print(
                  "::warning title=First managed backup is pending::"
                  "Recovery configuration is healthy. The 26-hour initial "
                  "collection grace remains bounded by the verifier."
              )
          PY

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-recovery-verification
          path: production-recovery-verification.json
          if-no-files-found: warn
          retention-days: 90

      - name: Open or update recovery incident
        if: >-
          failure() &&
          (
            github.event_name == 'schedule' ||
            inputs.manage_incident
          )
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Production] Recovery verification failing";
            const marker = "<!-- citylens-incident:recovery-verification -->";
            const runAttempt = process.env.GITHUB_RUN_ATTEMPT || "1";
            const runKey = `${context.runId}:${runAttempt}`;
            const runToken = `<!-- citylens-run:${runKey} -->`;
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;

            let report = {};
            if (fs.existsSync("production-recovery-verification.json")) {
              try {
                report = JSON.parse(
                  fs.readFileSync(
                    "production-recovery-verification.json",
                    "utf8",
                  ),
                );
              } catch (error) {
                core.warning(
                  `Could not parse recovery verification: ${error}`,
                );
              }
            }
            const failures =
              Array.isArray(report.failures) && report.failures.length > 0
                ? report.failures.slice(0, 20).map((value) => {
                    const safe = String(value).replace(/\r?\n/g, " ");
                    return `- ${safe}`;
                  })
                : ["- The verifier exited before recording a failure list."];
            const body = [
              marker,
              runToken,
              "The daily production recovery verification failed.",
              "",
              `- Latest failing run: [${context.runId}](${runUrl})`,
              `- Attempt: \`${runAttempt}\``,
              `- Commit: \`${context.sha}\``,
              `- Verified at: \`${report.verified_at || "unavailable"}\``,
              `- Status: \`${report.status || "unavailable"}\``,
              "",
              "### Verifier failures",
              "",
              ...failures,
              "",
              "Treat this as a production recovery incident. The next " +
                "successful scheduled check closes this issue automatically.",
            ].join("\n");

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );
            const issue = issues.find(
              (candidate) =>
                !candidate.pull_request &&
                candidate.title === title &&
                String(candidate.body || "").includes(marker),
            );
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title, body });
              return;
            }
            if (!String(issue.body || "").includes(runToken)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body:
                  `Failure persisted in [scheduled run ${context.runId}]` +
                  `(${runUrl}), attempt ${runAttempt}.`,
              });
            }
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

      - name: Close recovery incident after recovery
        if: >-
          success() &&
          (
            github.event_name == 'schedule' ||
            inputs.manage_incident
          )
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Production] Recovery verification failing";
            const marker = "<!-- citylens-incident:recovery-verification -->";
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );
            const issue = issues.find(
              (candidate) =>
                !candidate.pull_request &&
                candidate.title === title &&
                String(candidate.body || "").includes(marker),
            );
            if (!issue) {
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body:
                `Production recovery verification recovered in ` +
                `[scheduled run ${context.runId}](${runUrl}).`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed",
            });
