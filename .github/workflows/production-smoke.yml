name: production-smoke

on:
  schedule:
    # Six-hourly, offset from the top of the hour to avoid shared-runner spikes.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      api_base:
        description: API origin to verify
        required: false
        default: https://api.citylens.dev
        type: string
      web_base:
        description: Web origin to verify
        required: false
        default: https://www.citylens.dev
        type: string
      browser_api_base:
        description: Browser-facing API proxy origin to verify with auth
        required: false
        default: https://www.citylens.dev
        type: string
      max_age_days:
        description: Maximum acceptable parcel-feed age
        required: false
        default: "35"
        type: string
      manage_incident:
        description: Reconcile the production incident from this manual run
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify production contracts
        env:
          API_BASE: ${{ inputs.api_base || 'https://api.citylens.dev' }}
          WEB_BASE: ${{ inputs.web_base || 'https://www.citylens.dev' }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '35' }}
        run: |
          python scripts/verify_production.py \
            --api-base "${API_BASE}" \
            --web-base "${WEB_BASE}" \
            --max-age-days "${MAX_AGE_DAYS}" \
            --output production-verification.json

      - name: Verify curated demo artifacts
        if: always()
        env:
          API_BASE: ${{ inputs.api_base || 'https://api.citylens.dev' }}
          WEB_BASE: ${{ inputs.web_base || 'https://www.citylens.dev' }}
        run: |
          python scripts/verify_demo_artifacts.py \
            --api-base "${API_BASE}" \
            --web-origin "${WEB_BASE}" \
            --output demo-artifact-verification.json

      - name: Verify authenticated Parcel Intelligence inventory
        if: always()
        env:
          API_BASE: ${{ inputs.api_base || 'https://api.citylens.dev' }}
          CITYLENS_PARCEL_SMOKE_KEY: ${{ secrets.CITYLENS_PARCEL_SMOKE_KEY }}
        run: |
          python scripts/verify_authenticated_inventory.py \
            --api-base "${API_BASE}" \
            --output authenticated-production-verification.json

      - name: Verify browser-facing authenticated Parcel Intelligence inventory
        if: always()
        env:
          BROWSER_API_BASE: ${{ inputs.browser_api_base || 'https://www.citylens.dev' }}
          CITYLENS_PARCEL_SMOKE_KEY: ${{ secrets.CITYLENS_PARCEL_SMOKE_KEY }}
        run: |
          python scripts/verify_authenticated_inventory.py \
            --api-base "${BROWSER_API_BASE}" \
            --output browser-authenticated-production-verification.json

      - name: Publish verification summary
        if: always()
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          def read_report(path):
              report_path = Path(path)
              if not report_path.exists():
                  return None
              try:
                  return json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          report = read_report("production-verification.json")
          demos = read_report("demo-artifact-verification.json")
          authenticated = read_report(
              "authenticated-production-verification.json"
          )
          browser_authenticated = read_report(
              "browser-authenticated-production-verification.json"
          )
          passed = bool(
              report
              and report.get("passed")
              and demos
              and demos.get("passed")
              and authenticated
              and authenticated.get("passed")
              and browser_authenticated
              and browser_authenticated.get("passed")
          )
          icon = "✅" if passed else "❌"
          print(f"## {icon} CityLens production verification")
          print()
          print(
              f"- Public contracts: "
              f"`{'passed' if report and report.get('passed') else 'failed'}`"
          )
          print(
              f"- Curated demo artifacts: "
              f"`{'passed' if demos and demos.get('passed') else 'failed'}` · "
              f"`{(demos or {}).get('demo_count', 'unknown')}` demos · "
              f"`{(demos or {}).get('verified_artifact_count', 'unknown')}` / "
              f"`{(demos or {}).get('required_artifact_count', 'unknown')}` artifacts"
          )
          print(
              f"- Demo quality evidence: "
              f"`{(demos or {}).get('quality_target_status', 'unknown')}` "
              "(advisory; not current accuracy)"
          )
          print(
              f"- Authenticated inventory: "
              f"`{'passed' if authenticated and authenticated.get('passed') else 'failed'}`"
          )
          print(
              f"- Browser-facing authenticated inventory: "
              f"`{'passed' if browser_authenticated and browser_authenticated.get('passed') else 'failed'}`"
          )
          print(
              f"- Feed generation: "
              f"`{(report or {}).get('feed_generated_at', 'unknown')}`"
          )
          print(
              f"- Verified at: "
              f"`{(report or {}).get('verified_at', 'unknown')}`"
          )
          inventory = (authenticated or {}).get("inventory") or {}
          print(
              f"- Authenticated rows: "
              f"`{inventory.get('returned_count', 'unknown')}` / "
              f"`{inventory.get('available_count', 'unknown')}` · "
              f"complete `{inventory.get('inventory_complete', 'unknown')}`"
          )
          source_sla = (report or {}).get("source_sla") or {}
          print(
              f"- Source SLAs: `{len(source_sla.get('sources') or {})} checked`, "
              f"`{source_sla.get('warning_count', 0)} warning(s)`, "
              f"`{source_sla.get('breach_count', 0)} breach(es)`"
          )
          security = (report or {}).get("security_headers") or {}
          print(
              f"- Security headers: "
              f"`API {'passed' if (security.get('api') or {}).get('passed') else 'failed'}` · "
              f"`web {'passed' if (security.get('web') or {}).get('passed') else 'failed'}`"
          )
          warnings = (report or {}).get("warnings") or []
          if warnings:
              print()
              print("### Source freshness warnings")
              for warning in warnings:
                  print(f"- {warning}")
          demo_warnings = (demos or {}).get("warnings") or []
          if demo_warnings:
              print()
              print("### Advisory demo quality warnings")
              for warning in demo_warnings:
                  print(f"- {warning}")
          failures = []
          if report is None:
              failures.append("public verifier did not write a valid report")
          else:
              failures.extend(
                  f"public: {failure}"
                  for failure in report.get("failures") or []
              )
          if demos is None:
              failures.append(
                  "demo artifact verifier did not write a valid report"
              )
          else:
              failures.extend(
                  f"demos: {failure}"
                  for failure in demos.get("failures") or []
              )
          if authenticated is None:
              failures.append(
                  "authenticated verifier did not write a valid report"
              )
          else:
              failures.extend(
                  f"authenticated: {failure}"
                  for failure in authenticated.get("failures") or []
              )
          if browser_authenticated is None:
              failures.append(
                  "browser-authenticated verifier did not write a valid report"
              )
          else:
              failures.extend(
                  f"browser-authenticated: {failure}"
                  for failure in browser_authenticated.get("failures") or []
              )
          if failures:
              print()
              print("### Failures")
              for failure in failures:
                  print(f"- {failure}")
          PY

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-verification
          path: |
            production-verification.json
            demo-artifact-verification.json
            authenticated-production-verification.json
            browser-authenticated-production-verification.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update production incident
        if: >-
          failure() &&
          (
            github.event_name == 'schedule' ||
            inputs.manage_incident
          )
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Production] Scheduled verification failing";
            const marker = "<!-- citylens-incident:production-smoke -->";
            const runAttempt = process.env.GITHUB_RUN_ATTEMPT || "1";
            const runKey = `${context.runId}:${runAttempt}`;
            const runToken = `<!-- citylens-run:${runKey} -->`;
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;

            const readReport = (path) => {
              if (!fs.existsSync(path)) {
                return {};
              }
              try {
                return JSON.parse(fs.readFileSync(path, "utf8"));
              } catch (error) {
                core.warning(`Could not parse ${path}: ${error}`);
                return {};
              }
            };
            const report = readReport("production-verification.json");
            const demos = readReport("demo-artifact-verification.json");
            const authenticated = readReport(
              "authenticated-production-verification.json",
            );
            const browserAuthenticated = readReport(
              "browser-authenticated-production-verification.json",
            );
            const rawFailures = [
              ...(Array.isArray(report.failures)
                ? report.failures.map((value) => `public: ${value}`)
                : []),
              ...(Array.isArray(demos.failures)
                ? demos.failures.map((value) => `demos: ${value}`)
                : []),
              ...(Array.isArray(authenticated.failures)
                ? authenticated.failures.map(
                    (value) => `authenticated: ${value}`,
                  )
                : []),
              ...(Array.isArray(browserAuthenticated.failures)
                ? browserAuthenticated.failures.map(
                    (value) => `browser-authenticated: ${value}`,
                  )
                : []),
            ];
            if (!report.schema_version) {
              rawFailures.push("public verifier did not write a valid report");
            }
            if (!demos.schema_version) {
              rawFailures.push(
                "demo artifact verifier did not write a valid report",
              );
            }
            if (!authenticated.schema_version) {
              rawFailures.push(
                "authenticated verifier did not write a valid report",
              );
            }
            if (!browserAuthenticated.schema_version) {
              rawFailures.push(
                "browser-authenticated verifier did not write a valid report",
              );
            }
            const failures = rawFailures.length > 0
              ? rawFailures.slice(0, 20).map((value) => {
                  const safe = String(value).replace(/\r?\n/g, " ");
                  return `- ${safe}`;
                })
              : ["- The verifier exited before recording a failure list."];
            const body = [
              marker,
              runToken,
              "The six-hourly production verification workflow failed.",
              "",
              `- Latest failing run: [${context.runId}](${runUrl})`,
              `- Attempt: \`${runAttempt}\``,
              `- Commit: \`${context.sha}\``,
              `- Verified at: \`${report.verified_at || "unavailable"}\``,
              `- Feed generation: \`${report.feed_generated_at || "unavailable"}\``,
              `- Curated demos: \`${demos.demo_count || "unavailable"}\` demos, ` +
                `\`${demos.verified_artifact_count || "unavailable"}\` artifacts`,
              `- Demo quality evidence: \`${demos.quality_target_status || "unavailable"}\` ` +
                "(advisory; not current accuracy)",
              `- Authenticated inventory: \`${authenticated.inventory?.returned_count || "unavailable"}\` rows`,
              "",
              "### Verifier failures",
              "",
              ...failures,
              "",
              "Treat this as a production incident. The next successful " +
                "scheduled check closes this issue automatically.",
            ].join("\n");

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );
            const issue = issues.find(
              (candidate) =>
                !candidate.pull_request &&
                candidate.title === title &&
                String(candidate.body || "").includes(marker),
            );
            if (!issue) {
              await github.rest.issues.create({ owner, repo, title, body });
              return;
            }
            if (!String(issue.body || "").includes(runToken)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body:
                  `Failure persisted in [scheduled run ${context.runId}]` +
                  `(${runUrl}), attempt ${runAttempt}.`,
              });
            }
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

      - name: Close production incident after recovery
        if: >-
          success() &&
          (
            github.event_name == 'schedule' ||
            inputs.manage_incident
          )
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Production] Scheduled verification failing";
            const marker = "<!-- citylens-incident:production-smoke -->";
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}` +
              `/actions/runs/${context.runId}`;
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open", per_page: 100 },
            );
            const issue = issues.find(
              (candidate) =>
                !candidate.pull_request &&
                candidate.title === title &&
                String(candidate.body || "").includes(marker),
            );
            if (!issue) {
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body:
                `Production verification recovered in ` +
                `[scheduled run ${context.runId}](${runUrl}).`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "completed",
            });
