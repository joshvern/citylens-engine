name: adoption-report

on:
  schedule:
    # Daily, offset from other CityLens jobs and shared-runner peaks.
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Product-event lookback window (1-90 days)
        required: false
        default: "30"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: adoption-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out report tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.9"

      - name: Verify lockfile
        run: uv lock --check

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_ADOPTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ADOPTION_REPORTER_SERVICE_ACCOUNT }}

      - name: Sync report environment
        run: uv sync --package citylens-engine-api --no-dev --frozen

      - name: Generate aggregate adoption evidence
        env:
          DAYS: ${{ inputs.days || '30' }}
          PROJECT_ID: ${{ vars.CITYLENS_GCP_PROJECT }}
        run: |
          ./.venv/bin/python scripts/report_product_adoption.py \
            --project "${PROJECT_ID}" \
            --days "${DAYS}" \
            --output product-adoption-report.json

      - name: Publish adoption summary
        if: always()
        run: |
          if [[ ! -s product-adoption-report.json ]]; then
            echo "## ❌ CityLens adoption evidence" >> "${GITHUB_STEP_SUMMARY}"
            echo "No report was produced." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          ./.venv/bin/python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json

          report = json.load(
              open("product-adoption-report.json", encoding="utf-8")
          )
          gate = report["activation_evidence_gate"]
          inventory = report["workflow_inventory"]
          saved_views = report["saved_view_inventory"]
          reuse = report["saved_view_reuse"]
          thesis = report["thesis_monitor_engagement"]
          composer = report["thesis_composer_engagement"]
          funnel = report["acquisition_funnel"]
          audit = report["decision_audit_engagement"]
          underwriting = report["underwriting_engagement"]
          pilot = report["pilot_intake"]
          governance = report["measurement_governance"]
          icon = "✅" if gate["status"] == "ready" else "🟡"
          print(f"## {icon} CityLens adoption evidence")
          print()
          print(f"- Status: `{gate['status']}`")
          print(f"- Active users: `{report['active_users']}`")
          print(f"- Active user-days: `{report['active_user_days']}`")
          print(
              "- Governed synthetic monitors excluded: "
              f"`{governance['synthetic_actors_excluded']}` actor(s), "
              f"`{governance['product_usage_days_excluded']}` product "
              "usage day(s), "
              f"`{governance['workflow_records_excluded']}` workflow "
              "record(s), and "
              f"`{governance['saved_view_records_excluded']}` saved "
              "view record(s)"
          )
          print(f"- Parcel opens: `{report['events'].get('parcel_opened', 0)}`")
          print(
              f"- Verified market opens: "
              f"`{funnel['market_explorer']['opened']}` across "
              f"`{funnel['market_explorer']['users']}` user(s); "
              f"`{funnel['parcel_review']['market_users_reached']}` reviewed "
              "a parcel, "
              f"`{funnel['comparison']['market_users_reached']}` compared, "
              f"and `{funnel['workflow_create']['market_users_reached']}` "
              f"created a workflow (`{funnel['evidence_gate']['status']}`)"
          )
          print(
              f"- Canonical workflow records: `{inventory['records']}` "
              f"(`{inventory['active']}` active, "
              f"`{inventory['archived']}` archived)"
          )
          print(f"- Workflow users: `{inventory['users']}`")
          print(
              f"- Saved views: `{saved_views['records']}` across "
              f"`{saved_views['users']}` user(s); "
              f"`{saved_views['monitored_records']}` monitored across "
              f"`{saved_views['monitored_users']}` user(s)"
          )
          print(
              f"- Saved-view applies: `{reuse['applied']}` across "
              f"`{reuse['apply_users']}` user(s) "
              f"(`{reuse['evidence_gate']['status']}`)"
          )
          print(
              f"- Thesis monitor: `{thesis['baselines_advanced']}` baseline "
              f"advance(s) across `{thesis['baseline_advance_users']}` "
              f"user(s), `{thesis['change_reviews']}` change review(s) "
              f"across `{thesis['change_review_users']}` user(s) "
              f"(`{thesis['evidence_gate']['status']}`)"
          )
          print(
              f"- Constrained-thesis applies: `{composer['applied']}` across "
              f"`{composer['users']}` user(s) "
              f"(`{composer['evidence_gate']['status']}`)"
          )
          print(
              f"- Decision-audit opens: `{audit['opened']}` across "
              f"`{audit['users']}` user(s) "
              f"(`{audit['evidence_gate']['status']}`); "
              f"`{audit['workflow_creates']}` canonical workflow create(s) "
              f"across `{audit['workflow_users']}` user(s) "
              f"(`{audit['handoff_gate']['status']}`)"
          )
          print(
              f"- Underwriting: `{underwriting['opened']}` opens and "
              f"`{underwriting['first_adjustments']}` first adjustment(s) "
              f"across `{underwriting['adjustment_users']}` adjusting "
              f"user(s) (`{underwriting['evidence_gate']['status']}`); "
              f"`{underwriting['workflow_creates']}` canonical workflow "
              f"create(s) across `{underwriting['workflow_users']}` user(s) "
              f"(`{underwriting['handoff_gate']['status']}`)"
          )
          print(
              f"- Pilot requests: `{pilot['records']}` total, "
              f"`{pilot['recent_requests']}` in this window, "
              f"`{pilot['new_requests_waiting']}` waiting for review"
          )
          print()
          print(gate["claim"])
          if gate["status"] != "ready":
              print()
              print(
                  f"> Collecting: {gate['records_remaining']} more workflow "
                  f"record(s) and {gate['users_remaining']} more user(s) "
                  "are required for the directional activation gate."
              )
          PY

      - name: Flag a collecting activation gate
        if: success()
        run: |
          ./.venv/bin/python - <<'PY'
          import json

          report = json.load(
              open("product-adoption-report.json", encoding="utf-8")
          )
          gate = report["activation_evidence_gate"]
          reuse_gate = report["saved_view_reuse"]["evidence_gate"]
          thesis_gate = report["thesis_monitor_engagement"][
              "evidence_gate"
          ]
          composer_gate = report["thesis_composer_engagement"][
              "evidence_gate"
          ]
          funnel_gate = report["acquisition_funnel"]["evidence_gate"]
          audit_gate = report["decision_audit_engagement"]["evidence_gate"]
          audit_handoff_gate = report["decision_audit_engagement"][
              "handoff_gate"
          ]
          underwriting_gate = report["underwriting_engagement"][
              "evidence_gate"
          ]
          underwriting_handoff_gate = report["underwriting_engagement"][
              "handoff_gate"
          ]
          pilot = report["pilot_intake"]
          if gate["status"] != "ready":
              print(
                  "::warning title=Activation evidence is collecting::"
                  f"{gate['records_remaining']} workflow record(s) and "
                  f"{gate['users_remaining']} user(s) remain."
              )
          if reuse_gate["status"] != "ready":
              print(
                  "::warning title=Saved-view reuse evidence is collecting::"
                  f"{reuse_gate['applies_remaining']} apply event(s) and "
                  f"{reuse_gate['users_remaining']} user(s) remain."
              )
          if thesis_gate["status"] != "ready":
              print(
                  "::warning title=Thesis-monitor evidence is collecting::"
                  f"{thesis_gate['baseline_advances_remaining']} baseline "
                  "advance(s), "
                  f"{thesis_gate['baseline_advance_users_remaining']} "
                  "advancing user(s), "
                  f"{thesis_gate['change_reviews_remaining']} change "
                  "review(s), and "
                  f"{thesis_gate['change_review_users_remaining']} "
                  "reviewing user(s) remain."
              )
          if composer_gate["status"] != "ready":
              print(
                  "::warning title=Constrained-thesis engagement is collecting::"
                  f"{composer_gate['applies_remaining']} apply event(s) and "
                  f"{composer_gate['users_remaining']} user(s) remain."
              )
          if funnel_gate["status"] != "ready":
              print(
                  "::warning title=Market-to-diligence evidence is collecting::"
                  f"{funnel_gate['opens_remaining']} verified market open(s) "
                  f"and {funnel_gate['users_remaining']} user(s) remain."
              )
          if audit_gate["status"] != "ready":
              print(
                  "::warning title=Decision-audit engagement is collecting::"
                  f"{audit_gate['opens_remaining']} open event(s) and "
                  f"{audit_gate['users_remaining']} user(s) remain."
              )
          if audit_handoff_gate["status"] != "ready":
              print(
                  "::warning title=Decision-audit-to-workflow evidence is collecting::"
                  f"{audit_handoff_gate['workflow_creates_remaining']} "
                  "canonical workflow create(s) and "
                  f"{audit_handoff_gate['users_remaining']} user(s) remain."
              )
          if underwriting_gate["status"] != "ready":
              print(
                  "::warning title=Underwriting engagement is collecting::"
                  f"{underwriting_gate['opens_remaining']} open event(s), "
                  f"{underwriting_gate['open_users_remaining']} opening "
                  "user(s), "
                  f"{underwriting_gate['first_adjustments_remaining']} first "
                  "adjustment event(s), and "
                  f"{underwriting_gate['adjustment_users_remaining']} "
                  "adjusting user(s) remain."
              )
          if underwriting_handoff_gate["status"] != "ready":
              print(
                  "::warning title=Underwriting-to-workflow evidence is collecting::"
                  f"{underwriting_handoff_gate['workflow_creates_remaining']} "
                  "canonical workflow create(s) and "
                  f"{underwriting_handoff_gate['users_remaining']} user(s) "
                  "remain."
              )
          if pilot["new_requests_waiting"]:
              print(
                  "::warning title=Pilot requests are waiting::"
                  f"{pilot['new_requests_waiting']} request(s) need review."
              )
          PY

      - name: Upload aggregate adoption report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-adoption-report
          path: product-adoption-report.json
          if-no-files-found: warn
          retention-days: 90
